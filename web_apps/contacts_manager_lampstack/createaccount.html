<html lang="en">
  <head>
      <meta charset="UTF-8">
      <title>Nebulist | Create Account</title>
      <link rel="icon" type="image/x-icon" href="/images/favicon.png">
  
      <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Ubuntu&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="css/styles.css">
  
      <script src="js/code.js" defer></script>
  
      <script defer>
          document.addEventListener("DOMContentLoaded", () => {
              readCookie();
              if (userId > 0) {
                  window.location.href = "dashboard.html";
              }
          });
      </script>
  </head>
  
  <body>
    <div class="container">
    
        <h1>NEBULIST</h1>
        <h2>Create Account</h2>
      
        <main role="main" class="create-main">
          <div class="card login-card">
              <form onsubmit="doRegister(); return false;">
                  <input id="firstName" type="text" placeholder="First Name" required>
                  <input id="lastName" type="text" placeholder="Last Name" required>
                  <input id="username" type="text" placeholder="Username" required>
                  <input id="email" type="email" placeholder="Email" required>
                  <input id="password" type="password" placeholder="Password" required>
                  <input id="confirmPassword" type="password" placeholder="Confirm Password" required>
      
                  <button type="submit">Register</button>
              </form>
      
              <p id="registerResult"></p>
      
              <div class="login-links">
                  Already have an account?
                  <span>|</span> 
                  <a href="login.html">Login</a>
              </div>
          </div>
        </main>
    </div>
  </body>
</html>
