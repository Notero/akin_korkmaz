<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebulist | Dashboard</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.png">
  
    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Ubuntu&display=swap"
      rel="stylesheet"
    />
  
    <!-- Styles -->
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  
    <!-- Core JS -->
    <script src="../js/code.js" defer></script>
  
    <script defer>
      document.addEventListener("DOMContentLoaded", () => {
        readCookie();
  
        if (userId < 1) {
          window.location.replace("/login.html");
          return;
        }
  
        document.querySelector(".username-text").textContent =
          firstName + " " + lastName;
      });
    </script>
  </head>
  
  <body>
    <!-- Fixed Header -->
    <header class="dashboard-header">
      <h1 class="dashboard-title">NEBULIST</h1>
  
      <nav class="dashboard-nav">
        <a href="./" class="nav-link active">Home</a>
        <a href="contacts.html" class="nav-link">Contacts</a>
        <a href="about.html" class="nav-link">About Us</a>
        <a
          href="#"
          onclick="
            doLogout();
            return false;
          "
          class="nav-link logout"
          >Logout</a
        >
      </nav>
    </header>
  
    <!-- Main Content -->
    <main class="dashboard-main" role="main">
      <!-- Welcome Message -->
      <div class="welcome-section">
        <h2>Welcome back, <span class="username-text">Commander</span></h2>
        <p>
          Your command center awaits. Manage contacts, review activity, and
          configure system settings from this central hub.
        </p>
      </div>
    </main>
  </body>
</html>
